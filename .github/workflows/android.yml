name: Android build

# Builds run here on GitHub Actions (local sandbox Gradle builds are blocked
# by the egress proxy). Build code only: the owner builds/releases from
# these artifacts or from this workflow; no APK is built locally.
#
# Razorpay key ID is NOT baked in from this file: the booking app reads it
# from Firebase at runtime (admin Payments tab). The optional
# RAZORPAY_KEY_ID GitHub secret below is only a build-time fallback for
# builds made before the admin entry exists. GitHub masks secret values in
# logs. Firebase options likewise come from --dart-define only if the owner
# sets those secrets; otherwise the app shows its honest not-connected
# banner until Firebase is configured (see README).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: |
          DEFINE=""
          if [ -n "${{ secrets.RAZORPAY_KEY_ID }}" ]; then
            DEFINE="--dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}"
          fi
          flutter build apk --release $DEFINE
      - run: flutter build appbundle --release
      - run: |
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/kya-bro-public.apk
          cp build/app/outputs/bundle/release/app-release.aab /tmp/kya-bro-public.aab
      - run: |
          DEFINE=""
          if [ -n "${{ secrets.RAZORPAY_KEY_ID }}" ]; then
            DEFINE="--dart-define=RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}"
          fi
          flutter build apk --release -t lib/main_admin.dart $DEFINE
      - run: |
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/kya-bro-admin.apk
          ls -lh /tmp/kya-bro-*.apk /tmp/kya-bro-*.aab
          sha256sum /tmp/kya-bro-*.apk /tmp/kya-bro-*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: kya-bro-android
          path: |
            /tmp/kya-bro-public.apk
            /tmp/kya-bro-admin.apk
            /tmp/kya-bro-public.aab
