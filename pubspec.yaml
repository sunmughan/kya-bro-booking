name: kya_bro_booking
description: "Kya Bro booking app — book Himanshu Sarwa (@_kya_bro_) for videos. Public app + admin app in one Flutter codebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.0
  cloud_functions: ^5.4.0
  razorpay_flutter: ^1.4.0
  device_calendar: ^4.3.3
  timezone: ^0.9.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
